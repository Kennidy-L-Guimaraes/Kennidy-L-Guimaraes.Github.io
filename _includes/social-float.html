<aside class="social-float" aria-label="Social links">

  {% if site.author.email %}
  <a class="social-float__link"
    href="mailto:{{ site.author.email }}"
    onclick="window.open('https://mail.google.com/mail/?view=cm&to={{ site.author.email }}','_blank')"
     title="Email"
     aria-label="Send email">
    <svg viewBox="0 0 24 24">
      <path d="M4 6h16v12H4z"/>
      <path d="M4 6l8 6 8-6"/>
    </svg>
  </a>
  {% endif %}

  {% if site.author.linkedin %}
  <a class="social-float__link"
     href="https://linkedin.com/in/{{ site.author.linkedin }}"
     target="_blank" rel="noopener noreferrer"
     title="LinkedIn"
     aria-label="LinkedIn">
    <svg viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="2"/>
      <line x1="8" y1="10" x2="8" y2="16"/>
      <line x1="8" y1="7" x2="8" y2="7"/>
      <line x1="12" y1="10" x2="12" y2="16"/>
      <path d="M12 13a3 3 0 0 1 6 0v3"/>
    </svg>
  </a>
  {% endif %}

  {% if site.author.twitter %}
  <a class="social-float__link"
     href="https://x.com/{{ site.author.twitter }}"
     target="_blank" rel="noopener noreferrer"
     title="X"
     aria-label="X">
    <svg viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </a>
  {% endif %}

  {% if site.author.whatsapp %}
  <a class="social-float__link"
     href="https://wa.me/{{ site.author.whatsapp }}"
     target="_blank"
     title="WhatsApp"
     aria-label="WhatsApp">
    <svg viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 0 1-11.5 7l-4 1 1-4A8 8 0 1 1 20 12z"/>
      <path d="M9 10c1 2 3 3 5 4"/>
    </svg>
  </a>
  {% endif %}
  {% if site.author.github %}
  <a class="social-float__link"
     href="https://github.com/{{ site.author.github }}"
     target="_blank" rel="noopener noreferrer"
     title="GitHub"
     aria-label="GitHub">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>
  {% endif %}

  <a class="social-float__link"
     href="{{ '/feed.xml' | relative_url }}"
     title="RSS"
     aria-label="RSS">
    <svg viewBox="0 0 24 24">
      <path d="M4 11a9 9 0 0 1 9 9"/>
      <path d="M4 4a16 16 0 0 1 16 16"/>
      <circle cx="5" cy="19" r="1"/>
    </svg>
  </a>

</aside>
