
{%- assign ref = page.references[include.id] -%}
{%- if ref -%}
<a class="ref-link"
   href="{{ ref.url | escape }}"
   target="_blank"
   rel="noopener noreferrer">
  <sup>[{{ include.label | default: include.id | escape }}]</sup>
  <span class="ref-tooltip" role="tooltip">
    <span class="ref-tooltip__text">{{ ref.text | escape }}</span>
    <span class="ref-tooltip__url">{{ ref.url | escape }}</span>
  </span>
</a>
{%- else -%}
<span class="ref-missing">[Referência inexistente: {{ include.id | escape }}]</span>
{%- endif -%}
