{%- assign t = site.data.i18n.en -%}
<!doctype html>
<html lang="en">
<head>{% include head.html %}</head>
<body data-katex="{{ site.math.katex | default: '0.16.11' }}">
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="seal" aria-hidden="true"><img src="{{ site.author.seal | relative_url }}" alt=""></span>
      <span class="brand-name notranslate" translate="no">{{ site.title }}</span>
      {% assign tag = t.tagline | default: site.tagline %}{% if tag %}<span class="brand-tag">{{ tag }}</span>{% endif %}
    </a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="{{ t.search }}" aria-label="{{ t.search }}" autocomplete="off" data-json="{{ '/search.json' | relative_url }}" data-empty="{{ t.search_empty }}">
      <ul id="search-results" hidden></ul>
    </div>
    {% include lang-switch.html %}
    <button id="theme-toggle" type="button" aria-label="{{ t.theme }}">◐</button>
  </header>
  <div class="rule" aria-hidden="true"></div>
  {{ content }}
  {% include footer.html %}
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,pt,es',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script async src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script type="module" src="{{ '/assets/js/mermaid.js' | relative_url }}"></script>
</body>
</html>
