---
layout: default
---
<article class="post" data-cat="{{ page.categories }}" data-ts="{{ page.date | date: '%s' }}">
  {% include series-nav.html mode="top" %}

  <p class="meta">{{ page.date | date: "%d/%m/%Y" }} · {{ page.categories }}</p>
  <h1>{{ page.title }}</h1>

  <div class="toc-rail">
    <details class="toc" data-toc hidden open>
      <summary>{{ site.data.i18n.en.toc }}</summary>
    </details>
  </div>

  {{ content }}

  {% include series-nav.html mode="bottom" %}
  {% include ad.html %}
</article>
